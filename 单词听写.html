<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>单词听写助手</title>
    <style>
        /* ========== 全局重置 & 基础 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f4f8;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        .app {
            max-width: 720px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            padding: 28px 24px 32px;
            transition: all 0.2s;
        }

        /* ========== 头部 ========== */
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .header-icon {
            font-size: 32px;
            line-height: 1;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.3px;
        }
        .header .sub {
            font-size: 14px;
            color: #64748b;
            font-weight: 400;
            -webkit-text-fill-color: #64748b;
            margin-left: auto;
            background: #f1f5f9;
            padding: 4px 14px;
            border-radius: 20px;
            white-space: nowrap;
        }

        /* ========== 上传区域 ========== */
        .upload-area {
            border: 2px dashed #cbd5e1;
            border-radius: 18px;
            padding: 30px 20px;
            text-align: center;
            background: #fafcff;
            transition: border-color 0.25s, background 0.25s;
            cursor: pointer;
            position: relative;
            margin-bottom: 18px;
        }
        .upload-area:hover {
            border-color: #94a3b8;
            background: #f8fafc;
        }
        .upload-area.dragover {
            border-color: #2563eb;
            background: #eff6ff;
        }
        .upload-area .icon {
            font-size: 44px;
            display: block;
            margin-bottom: 6px;
        }
        .upload-area .text {
            font-size: 16px;
            font-weight: 500;
            color: #1e293b;
        }
        .upload-area .hint {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .upload-area input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }
        .upload-area .file-name {
            margin-top: 10px;
            font-size: 14px;
            color: #2563eb;
            font-weight: 500;
            word-break: break-all;
        }

        /* ========== 快捷操作 ========== */
        .quick-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .quick-actions .btn-example {
            background: #f1f5f9;
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            color: #334155;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .quick-actions .btn-example:hover {
            background: #e2e8f0;
        }
        .quick-actions .btn-example:active {
            transform: scale(0.96);
        }
        .quick-actions .word-count {
            margin-left: auto;
            font-size: 14px;
            color: #64748b;
            background: #f1f5f9;
            padding: 4px 16px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .quick-actions .word-count span {
            font-weight: 700;
            color: #1e293b;
        }

        /* ========== 当前播放区域（可折叠） ========== */
        .current-word-display {
            background: linear-gradient(135deg, #f8fafc, #eef2ff);
            border-radius: 18px;
            padding: 12px 16px 14px;
            margin-bottom: 12px;
            border: 1px solid #e2e8f0;
            transition: border-color 0.3s, padding 0.3s;
            min-height: 70px;
        }
        .current-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .current-header .label {
            font-size: 13px;
            color: #94a3b8;
            letter-spacing: 1px;
            font-weight: 500;
        }
        .current-header .toggle-btn {
            background: none;
            border: 1px solid #d1d5db;
            border-radius: 20px;
            padding: 2px 12px;
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            line-height: 1.6;
            white-space: nowrap;
        }
        .current-header .toggle-btn:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .current-header .toggle-btn:active {
            transform: scale(0.94);
        }

        .current-content {
            transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
            overflow: hidden;
            max-height: 200px;
            opacity: 1;
            padding-top: 2px;
        }
        .current-word-display.collapsed .current-content {
            max-height: 0;
            opacity: 0;
            padding-top: 0;
            margin: 0;
        }

        .current-word-display .word {
            font-size: 36px;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.3;
            min-height: 48px;
            word-break: break-word;
            text-align: center;
        }
        .current-word-display .word.idle {
            color: #94a3b8;
            font-weight: 400;
            font-size: 20px;
        }
        .current-word-display .progress-text {
            font-size: 14px;
            color: #64748b;
            margin-top: 4px;
            text-align: center;
        }

        /* ========== 答题输入 ========== */
        .answer-row {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }
        .answer-input {
            flex: 1;
            min-width: 0;
            height: 58px;
            border: none;
            border-radius: 0;
            background: transparent;
            padding: 0 14px;
            font-size: 34px;
            font-weight: 700;
            color: #0f172a;
            text-align: center;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        .answer-input::placeholder {
            color: #a6b1c5;
            font-weight: 500;
            font-size: 15px;
        }
        .answer-input:focus {
            box-shadow: none;
            outline: none;
        }
        .answer-input:disabled {
            background: transparent;
            color: #94a3b8;
        }
        .answer-feedback {
            min-height: 20px;
            margin-top: 6px;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.5;
            word-break: break-word;
            text-align: center;
        }
        .answer-feedback.ok {
            color: #0a9d7c;
        }
        .answer-feedback.bad {
            color: #ef5350;
        }
        .answer-feedback.info {
            color: #64748b;
        }
        .answer-actions {
            display: flex;
            justify-content: center;
            margin-top: 2px;
        }
        .reveal-btn {
            border: none;
            background: none;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 8px;
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        .reveal-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            text-decoration: none;
        }
        .reveal-btn:active {
            transform: scale(0.96);
        }

        /* ========== 可拖动进度条 ========== */
        .progress-slider-area {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 4px 12px 4px;
        }
        .progress-slider-area input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            background: #e2e8f0;
            border-radius: 4px;
            outline: none;
            transition: background 0.2s;
        }
        .progress-slider-area input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #2563eb;
            cursor: pointer;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
        }
        .progress-slider-area input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #2563eb;
            cursor: pointer;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
        }
        .progress-slider-area .slider-label {
            font-size: 14px;
            font-weight: 600;
            color: #475569;
            min-width: 60px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .progress-slider-area .slider-label span {
            color: #2563eb;
        }

        /* ========== 控制面板 ========== */
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 6px;
            margin-bottom: 16px;
            background: #f8fafc;
            padding: 10px 12px;
            border-radius: 18px;
            border: 1px solid #e2e8f0;
        }
        .controls .btn-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            flex: 1 1 auto;
            justify-content: center;
        }
        .controls button {
            border: none;
            padding: 8px 14px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-width: 44px;
            min-height: 40px;
            touch-action: manipulation;
            background: #ffffff;
            color: #1e293b;
            border: 1px solid #d1d5db;
        }
        .controls button:active {
            transform: scale(0.94);
        }
        .controls button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            border-color: #e2e8f0;
        }
        .controls .btn-play {
            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
        }
        .controls .btn-play:hover:not(:disabled) {
            background: #1d4ed8;
        }
        .controls .btn-pause {
            background: #f59e0b;
            color: #fff;
            border-color: #f59e0b;
        }
        .controls .btn-pause:hover:not(:disabled) {
            background: #d97706;
        }
        .controls .btn-stop {
            background: #ef4444;
            color: #fff;
            border-color: #ef4444;
        }
        .controls .btn-stop:hover:not(:disabled) {
            background: #dc2626;
        }
        .controls .btn-resume {
            background: #10b981;
            color: #fff;
            border-color: #10b981;
        }
        .controls .btn-resume:hover:not(:disabled) {
            background: #059669;
        }
        .controls .btn-nav {
            background: #f1f5f9;
            border-color: #d1d5db;
            color: #1e293b;
            padding: 8px 12px;
        }
        .controls .btn-nav:hover:not(:disabled) {
            background: #e2e8f0;
        }
        .controls .btn-repeat {
            background: #8b5cf6;
            color: #fff;
            border-color: #8b5cf6;
        }
        .controls .btn-repeat:hover:not(:disabled) {
            background: #7c3aed;
        }

        .controls .spacer {
            flex: 1;
            min-width: 4px;
        }

        /* ========== 间隔调节 ========== */
        .interval-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #ffffff;
            padding: 4px 12px 4px 16px;
            border-radius: 40px;
            border: 1px solid #e2e8f0;
            flex-wrap: wrap;
            min-height: 40px;
            margin-top: 4px;
            width: 100%;
        }
        .interval-control label {
            font-size: 14px;
            font-weight: 500;
            color: #475569;
            white-space: nowrap;
        }
        .interval-control input[type="range"] {
            width: 110px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #cbd5e1;
            border-radius: 4px;
            outline: none;
            transition: background 0.2s;
            flex: 1;
        }
        .interval-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #2563eb;
            cursor: pointer;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
        }
        .interval-control input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #2563eb;
            cursor: pointer;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
        }
        .interval-control .interval-value {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            min-width: 40px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        /* ========== 单词列表 ========== */
        .word-list-container {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            overflow: hidden;
            margin-top: 4px;
            background: #ffffff;
            transition: border-radius 0.2s;
        }
        .word-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            letter-spacing: 0.3px;
            transition: border-bottom 0.2s;
        }
        .word-list-header .left {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .word-list-header .right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toggle-btn {
            background: none;
            border: 1px solid #d1d5db;
            border-radius: 20px;
            padding: 2px 12px;
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            line-height: 1.6;
            white-space: nowrap;
        }
        .toggle-btn:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .toggle-btn:active {
            transform: scale(0.94);
        }

        .word-list {
            max-height: 260px;
            overflow-y: auto;
            padding: 4px 0;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            transition: max-height 0.3s ease, padding 0.3s ease;
        }
        .word-list::-webkit-scrollbar {
            width: 5px;
        }
        .word-list::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .word-list::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }

        .word-list-container.collapsed .word-list {
            max-height: 0;
            padding: 0;
            overflow: hidden;
            border: none;
        }
        .word-list-container.collapsed .word-list-header {
            border-bottom: none;
            border-radius: 16px;
        }

        .word-item {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            font-size: 15px;
            border-bottom: 1px solid #f1f5f9;
            transition: background 0.2s, color 0.2s;
            gap: 10px;
        }
        .word-item:last-child {
            border-bottom: none;
        }
        .word-item .idx {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            min-width: 28px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .word-item .text {
            flex: 1;
            word-break: break-word;
            font-weight: 500;
            color: #1e293b;
        }
        .word-item .status-icon {
            font-size: 14px;
            width: 22px;
            text-align: center;
            flex-shrink: 0;
        }
        .word-item.done .text {
            color: #94a3b8;
            font-weight: 400;
        }
        .word-item.done .idx {
            color: #94a3b8;
        }
        .word-item.active {
            background: #eff6ff;
            border-left: 4px solid #2563eb;
            padding-left: 12px;
        }
        .word-item.active .text {
            color: #1d4ed8;
            font-weight: 700;
        }
        .word-item.active .idx {
            color: #2563eb;
            font-weight: 700;
        }
        .word-item.pending .text {
            color: #1e293b;
        }
        .word-item.active .status-icon {
            color: #2563eb;
        }
        .word-item.done .status-icon {
            color: #22c55e;
        }
        .word-item.correct .text {
            color: #0a9d7c;
        }
        .word-item.correct .status-icon {
            color: #22c55e;
        }
        .word-item.correct .idx {
            color: #0a9d7c;
        }
        .word-item.wrong .text {
            color: #ef5350;
        }
        .word-item.wrong .status-icon {
            color: #ef5350;
        }
        .word-item.wrong .idx {
            color: #ef5350;
        }
        .word-item.masked .text {
            color: #b9c3d6;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        /* ========== 底部提示 ========== */
        .footer-tip {
            margin-top: 16px;
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .footer-tip .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #cbd5e1;
            display: inline-block;
        }

        /* ========== 空状态 ========== */
        .empty-state {
            padding: 30px 20px;
            text-align: center;
            color: #94a3b8;
        }
        .empty-state .big-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
        }
        .empty-state .title {
            font-size: 18px;
            font-weight: 600;
            color: #475569;
        }
        .empty-state .desc {
            font-size: 14px;
            margin-top: 4px;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 600px) {
            .app {
                padding: 16px 14px 20px;
                border-radius: 20px;
            }
            .header h1 {
                font-size: 20px;
            }
            .header .sub {
                font-size: 12px;
                padding: 2px 12px;
            }
            .upload-area {
                padding: 20px 14px;
            }
            .upload-area .icon {
                font-size: 34px;
            }
            .upload-area .text {
                font-size: 15px;
            }
            .current-word-display .word {
                font-size: 28px;
                min-height: 38px;
            }
            .answer-input {
                height: 52px;
                font-size: 27px;
                padding: 0 10px;
            }
            .answer-input::placeholder {
                font-size: 14px;
            }
            .answer-feedback {
                font-size: 12.5px;
                margin-top: 5px;
            }
            .controls {
                padding: 8px 10px;
                gap: 6px;
            }
            .controls button {
                padding: 6px 10px;
                font-size: 13px;
                min-height: 36px;
                min-width: 38px;
            }
            .controls .btn-nav {
                padding: 6px 8px;
            }
            .interval-control {
                padding: 4px 10px 4px 14px;
                width: 100%;
            }
            .interval-control input[type="range"] {
                width: 100%;
                flex: 1;
            }
            .word-item {
                padding: 6px 12px;
                font-size: 14px;
            }
            .word-item .idx {
                min-width: 22px;
                font-size: 11px;
            }
            .word-list {
                max-height: 200px;
            }
            .quick-actions .btn-example {
                font-size: 13px;
                padding: 6px 14px;
            }
            .word-list-header {
                flex-wrap: wrap;
                gap: 6px;
            }
            .word-list-header .right {
                gap: 6px;
            }
            .toggle-btn {
                font-size: 12px;
                padding: 2px 10px;
            }
            .current-header .toggle-btn {
                font-size: 12px;
                padding: 2px 10px;
            }
            .progress-slider-area .slider-label {
                font-size: 12px;
                min-width: 50px;
            }
        }

        @media (max-width: 400px) {
            .app {
                padding: 12px 10px 16px;
            }
            .header h1 {
                font-size: 18px;
            }
            .current-word-display .word {
                font-size: 24px;
            }
            .controls button {
                font-size: 12px;
                padding: 4px 8px;
                min-height: 32px;
                min-width: 32px;
            }
            .controls .btn-group {
                gap: 3px;
            }
            .progress-slider-area input[type="range"] {
                height: 4px;
            }
            .progress-slider-area input[type="range"]::-webkit-slider-thumb {
                width: 16px;
                height: 16px;
            }
        }

        /* ========== 工具类 ========== */
        .hidden {
            display: none !important;
        }
        .fade-in {
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tts-warning {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 14px;
            color: #b91c1c;
            margin-bottom: 12px;
            display: none;
        }
        .tts-warning.show {
            display: block;
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- ===== 头部 ===== -->
        <div class="header">
            <span class="header-icon">🎧</span>
            <h1>单词听写助手</h1>
            <span class="sub">TXT · 语音</span>
        </div>

        <!-- ===== 上传区域 ===== -->
        <div class="upload-area" id="uploadArea">
            <span class="icon">📂</span>
            <div class="text">上传 TXT 单词文件</div>
            <div class="hint">每行一个单词或词组 · 支持 .txt</div>
            <input type="file" id="fileInput" accept=".txt,text/plain">
            <div class="file-name" id="fileName"></div>
        </div>

        <!-- ===== 快捷操作 ===== -->
        <div class="quick-actions">
            <button class="btn-example" id="btnExample">📋 使用示例数据</button>
            <button class="btn-example" id="btnClear">🗑️ 清空</button>
            <div class="word-count" id="wordCount">📝 共 <span id="totalWords">0</span> 个词</div>
        </div>

        <!-- ===== TTS 警告 ===== -->
        <div class="tts-warning" id="ttsWarning">
            ⚠️ 您的浏览器可能不支持语音合成，请使用最新版 Chrome / Edge / Safari。
        </div>

        <!-- ===== 当前播放区域（可折叠） ===== -->
        <div class="current-word-display" id="currentDisplay">
            <div class="current-header">
                <span class="label" id="currentLabel">✏️ 听写答题</span>
                <button class="toggle-btn" id="toggleCurrentBtn">▲ 收起</button>
            </div>
            <div class="current-content" id="currentContent">
                <form class="answer-row" id="answerForm" autocomplete="off">
                    <input class="answer-input" id="answerInput" type="text" inputmode="text" enterkeyhint="done" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="输入你听到的单词" placeholder="输入你听到的单词…" disabled>
                </form>
                <div class="answer-feedback" id="answerFeedback" aria-live="polite"></div>
                <div class="answer-actions">
                    <button class="reveal-btn" id="revealBtn" type="button" disabled>看答案</button>
                </div>
                <div class="progress-text" id="progressText">0 / 0</div>
            </div>
        </div>

        <!-- ===== 可拖动进度条 ===== -->
        <div class="progress-slider-area">
            <input type="range" id="progressSlider" min="0" max="0" value="0" step="1">
            <span class="slider-label" id="sliderLabel"><span id="sliderIndex">0</span> / <span id="sliderTotal">0</span></span>
        </div>

        <!-- ===== 控制面板 ===== -->
        <div class="controls" id="controls">
            <div class="btn-group">
                <!-- 上一首 -->
                <button class="btn-nav" id="btnPrev" disabled title="上一个">⏮</button>
                <!-- 播放/暂停 -->
                <button class="btn-play" id="btnPlay" disabled>▶ 播放</button>
                <button class="btn-pause hidden" id="btnPause">⏸ 暂停</button>
                <button class="btn-resume hidden" id="btnResume">▶ 继续</button>
                <!-- 下一首 -->
                <button class="btn-nav" id="btnNext" disabled title="下一个">⏭</button>
                <!-- 重复 -->
                <button class="btn-repeat" id="btnRepeat" disabled title="重复播放当前词">🔁</button>
                <!-- 停止 -->
                <button class="btn-stop" id="btnStop" disabled>⏹</button>
            </div>
            <div class="spacer"></div>
            <div class="interval-control">
                <label for="intervalRange">⏱ 间隔</label>
                <input type="range" id="intervalRange" min="0.5" max="10" step="0.5" value="3.0">
                <span class="interval-value" id="intervalDisplay">3.0s</span>
            </div>
        </div>

        <!-- ===== 单词列表 ===== -->
        <div class="word-list-container" id="wordListContainer">
            <div class="word-list-header">
                <span class="left">📋 单词列表</span>
                <div class="right">
                    <span id="listStatus">就绪</span>
                    <button class="toggle-btn" id="toggleWordListBtn">▲ 收起</button>
                </div>
            </div>
            <div class="word-list" id="wordList">
                <div class="empty-state">
                    <span class="big-icon">📤</span>
                    <div class="title">还没有单词</div>
                    <div class="desc">上传 TXT 文件或点击「使用示例数据」</div>
                </div>
            </div>
        </div>

        <!-- ===== 底部 ===== -->
        <div class="footer-tip">
            <span>🔊 确保浏览器音量已打开</span>
            <span class="dot"></span>
            <span>💡 支持手机 / 电脑</span>
        </div>
    </div>

    <script>
        // ================================================================
        //  JavaScript 核心逻辑（间隔调整精确计算剩余时间）
        // ================================================================

        (function() {
            'use strict';

            // ---------- DOM 引用 ----------
            const fileInput = document.getElementById('fileInput');
            const uploadArea = document.getElementById('uploadArea');
            const fileName = document.getElementById('fileName');
            const btnExample = document.getElementById('btnExample');
            const btnClear = document.getElementById('btnClear');
            const wordListEl = document.getElementById('wordList');
            const totalWords = document.getElementById('totalWords');
            const listStatus = document.getElementById('listStatus');

            const btnPlay = document.getElementById('btnPlay');
            const btnPause = document.getElementById('btnPause');
            const btnResume = document.getElementById('btnResume');
            const btnStop = document.getElementById('btnStop');
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');
            const btnRepeat = document.getElementById('btnRepeat');

            const intervalRange = document.getElementById('intervalRange');
            const intervalDisplay = document.getElementById('intervalDisplay');

            const answerForm = document.getElementById('answerForm');
            const answerInput = document.getElementById('answerInput');
            const answerFeedback = document.getElementById('answerFeedback');
            const revealBtn = document.getElementById('revealBtn');
            const progressText = document.getElementById('progressText');
            const progressSlider = document.getElementById('progressSlider');
            const sliderIndex = document.getElementById('sliderIndex');
            const sliderTotal = document.getElementById('sliderTotal');

            const ttsWarning = document.getElementById('ttsWarning');

            // 折叠按钮
            const toggleCurrentBtn = document.getElementById('toggleCurrentBtn');
            const currentDisplay = document.getElementById('currentDisplay');
            const toggleListBtn = document.getElementById('toggleWordListBtn');
            const wordListContainer = document.getElementById('wordListContainer');

            // ---------- 状态 ----------
            let words = [];
            let currentIndex = 0;
            let isPlaying = false;
            let isPaused = false;
            let isStopped = true;
            let timerId = null;
            let timerStartTime = null; // 记录定时器开始的时间戳
            let utterance = null;
            let isSpeaking = false;
            let results = {};
            let answered = false;
            let autoAdvanceTimer = null;

            // 示例数据
            const EXAMPLE_WORDS = [
                'abandon', 'absorb', 'abstract', 'accomplish', 'accurate',
                'achieve', 'acquisition', 'adapt', 'adequate', 'adjust',
                'administration', 'adopt', 'advance', 'advantage', 'adversary',
                'advocate', 'affect', 'aggregate', 'aggressive', 'allocate',
                'alternative', 'ambitious', 'analyze', 'annual', 'anticipate',
                'apparent', 'appreciate', 'approach', 'appropriate', 'approximate',
                'look forward to', 'take into account', 'in terms of',
                'on the other hand', 'as a result', 'in addition',
                'in conclusion', 'for instance', 'in contrast', 'in general'
            ];

            // ---------- 辅助函数 ----------
            function getInterval() {
                return parseFloat(intervalRange.value);
            }

            function updateIntervalDisplay() {
                const val = getInterval();
                intervalDisplay.textContent = val.toFixed(1) + 's';
            }

            function updateWordCount() {
                totalWords.textContent = words.length;
                sliderTotal.textContent = words.length;
                progressSlider.max = words.length > 0 ? words.length - 1 : 0;
                if (words.length === 0) {
                    progressSlider.value = 0;
                    sliderIndex.textContent = '0';
                } else {
                    progressSlider.value = Math.min(currentIndex, words.length - 1);
                    sliderIndex.textContent = currentIndex + 1;
                }
            }

            function updateListStatus(text) {
                listStatus.textContent = text;
            }

            // ---------- 答题判分 ----------
            function normalizeAnswer(text) {
                return String(text)
                    .trim()
                    .toLowerCase()
                    .replace(/[’‘]/g, "'")
                    .replace(/[–—]/g, '-')
                    .replace(/-/g, ' ')
                    .replace(/\s+/g, ' ')
                    .replace(/^[\s.,!?;:]+|[\s.,!?;:]+$/g, '');
            }

            function maskedText(word) {
                const length = String(word).replace(/\s+/g, '').length;
                return '•'.repeat(Math.max(3, Math.min(14, length)));
            }

            function clearAutoAdvance() {
                if (autoAdvanceTimer) {
                    clearTimeout(autoAdvanceTimer);
                    autoAdvanceTimer = null;
                }
            }

            function canAcceptAnswer() {
                return words.length > 0 && currentIndex < words.length && (isPlaying || isPaused || isSpeaking);
            }

            function syncAnswerUI() {
                const enable = canAcceptAnswer() && !answered;
                answerInput.disabled = !enable;
                revealBtn.disabled = !(canAcceptAnswer() && !answered);
            }

            function resetAnswerState() {
                clearAutoAdvance();
                answered = false;
                answerInput.value = '';
                answerFeedback.textContent = '';
                answerFeedback.className = 'answer-feedback';
                syncAnswerUI();
            }

            function applyAnsweredState(kind, userInput) {
                answered = true;
                answerInput.disabled = true;
                revealBtn.disabled = true;

                if (kind === 'correct') {
                    answerFeedback.textContent = '✓ 正确！即将进入下一题…';
                    answerFeedback.className = 'answer-feedback ok';
                    if (!isPaused) {
                        clearAutoAdvance();
                        autoAdvanceTimer = setTimeout(function() {
                            autoAdvanceTimer = null;
                            if (currentIndex + 1 >= words.length) {
                                finishPlayback();
                            } else {
                                jumpTo(currentIndex + 1, true);
                            }
                        }, 800);
                    }
                } else if (kind === 'wrong') {
                    answerFeedback.textContent = '✗ 正确答案：' + words[currentIndex] + (userInput ? '（你输入：' + userInput + '）' : '');
                    answerFeedback.className = 'answer-feedback bad';
                } else {
                    answerFeedback.textContent = '答案：' + words[currentIndex];
                    answerFeedback.className = 'answer-feedback info';
                }
                renderWordList();
                updateButtons();
            }

            function evaluateAnswer() {
                if (words.length === 0 || currentIndex >= words.length || answered) return;
                if (!isPlaying && !isPaused && !isSpeaking) return;
                const raw = answerInput.value.trim();
                if (!raw) {
                    answerFeedback.textContent = '先输入答案，或点击「看答案」';
                    answerFeedback.className = 'answer-feedback info';
                    try { answerInput.focus(); } catch (e) {}
                    return;
                }
                const expected = normalizeAnswer(words[currentIndex]);
                const actual = normalizeAnswer(raw);
                if (timerId) {
                    clearTimeout(timerId);
                    timerId = null;
                    timerStartTime = null;
                }
                if (actual === expected) {
                    results[currentIndex] = 'correct';
                    applyAnsweredState('correct', raw);
                } else {
                    results[currentIndex] = 'wrong';
                    applyAnsweredState('wrong', raw);
                }
            }

            function revealAnswer() {
                if (words.length === 0 || currentIndex >= words.length || answered) return;
                if (!isPlaying && !isPaused && !isSpeaking) return;
                if (timerId) {
                    clearTimeout(timerId);
                    timerId = null;
                    timerStartTime = null;
                }
                results[currentIndex] = 'wrong';
                applyAnsweredState('revealed', '');
            }

            function checkTTS() {
                if (!window.speechSynthesis) {
                    ttsWarning.classList.add('show');
                    return false;
                }
                ttsWarning.classList.remove('show');
                return true;
            }

            // ---------- 折叠切换 ----------
            function toggleCurrent() {
                currentDisplay.classList.toggle('collapsed');
                const btn = toggleCurrentBtn;
                btn.textContent = currentDisplay.classList.contains('collapsed') ? '▼ 展开' : '▲ 收起';
            }

            function toggleList() {
                wordListContainer.classList.toggle('collapsed');
                const btn = toggleListBtn;
                btn.textContent = wordListContainer.classList.contains('collapsed') ? '▼ 展开' : '▲ 收起';
            }

            function initVisibility() {
                currentDisplay.classList.remove('collapsed');
                toggleCurrentBtn.textContent = '▲ 收起';
                wordListContainer.classList.remove('collapsed');
                toggleListBtn.textContent = '▲ 收起';
            }

            // ---------- 渲染单词列表 ----------
            function renderWordList() {
                if (words.length === 0) {
                    wordListEl.innerHTML = `
                        <div class="empty-state">
                            <span class="big-icon">📤</span>
                            <div class="title">还没有单词</div>
                            <div class="desc">上传 TXT 文件或点击「使用示例数据」</div>
                        </div>
                    `;
                    updateWordCount();
                    updateListStatus('就绪');
                    return;
                }

                let html = '';
                for (let i = 0; i < words.length; i++) {
                    const result = results[i];
                    const hadResult = result === 'correct' || result === 'wrong';
                    const hideActive = i === currentIndex && !answered;
                    const revealed = hadResult && !hideActive;
                    const display = revealed ? words[i] : maskedText(words[i]);

                    let cls = 'word-item';
                    let statusIcon = '○';
                    let statusText = '待播放';

                    if (!revealed) {
                        cls += ' masked';
                        statusIcon = '○';
                        statusText = '待答';
                    } else if (result === 'correct') {
                        cls += ' correct';
                        statusIcon = '✓';
                        statusText = '答对';
                    } else if (result === 'wrong') {
                        cls += ' wrong';
                        statusIcon = '✗';
                        statusText = '答错';
                    } else if (i < currentIndex) {
                        cls += ' done';
                        statusIcon = '✓';
                        statusText = '已完成';
                    }

                    if (i === currentIndex && (isPlaying || isPaused || isSpeaking)) {
                        cls += ' active';
                        statusIcon = revealed ? (result === 'correct' ? '✓' : result === 'wrong' ? '✗' : '▶') : '▶';
                        statusText = '当前';
                    }

                    html += `
                        <div class="${cls}" data-index="${i}">
                            <span class="idx">${i + 1}</span>
                            <span class="text">${escapeHtml(display)}</span>
                            <span class="status-icon" title="${statusText}">${statusIcon}</span>
                        </div>
                    `;
                }
                wordListEl.innerHTML = html;

                const activeItem = wordListEl.querySelector('.word-item.active');
                if (activeItem) {
                    activeItem.scrollIntoView({ block: 'center', behavior: 'smooth' });
                }

                updateWordCount();
                updateListStatus(`${words.length} 个词`);
                updateSliderAndProgress();
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ---------- 更新进度和滑块 ----------
            function updateSliderAndProgress() {
                const total = words.length;
                if (total === 0) {
                    progressSlider.value = 0;
                    sliderIndex.textContent = '0';
                    progressText.textContent = '0 / 0';
                    return;
                }
                const idx = Math.min(currentIndex, total - 1);
                progressSlider.value = idx;
                sliderIndex.textContent = idx + 1;
                progressText.textContent = `${idx + 1} / ${total}`;
                syncAnswerUI();
            }

            // ---------- 更新播放进度显示 ----------
            function updateProgress() {
                const total = words.length;
                const idx = Math.min(currentIndex, total - 1);
                if (total === 0) {
                    progressText.textContent = '0 / 0';
                    progressSlider.value = 0;
                    sliderIndex.textContent = '0';
                    sliderTotal.textContent = '0';
                    answerFeedback.textContent = '';
                    answerFeedback.className = 'answer-feedback';
                    syncAnswerUI();
                } else {
                    if (currentIndex >= total) {
                        progressText.textContent = `${total} / ${total}`;
                        progressSlider.value = total - 1;
                        sliderIndex.textContent = String(total);
                        sliderTotal.textContent = String(total);
                    } else {
                        progressText.textContent = `${idx + 1} / ${total}`;
                        progressSlider.value = idx;
                        sliderIndex.textContent = idx + 1;
                        sliderTotal.textContent = total;
                        syncAnswerUI();
                    }
                }
                updateButtons();
                renderWordList();
            }

            // ---------- 更新按钮状态 ----------
            function updateButtons() {
                const hasWords = words.length > 0;
                const isComplete = currentIndex >= words.length && words.length > 0;

                btnPlay.disabled = !(hasWords && !isPlaying && !isPaused && !isSpeaking && !isComplete);
                if (isPlaying || isSpeaking) {
                    btnPause.classList.remove('hidden');
                    btnPause.disabled = false;
                } else {
                    btnPause.classList.add('hidden');
                }
                if (isPaused) {
                    btnResume.classList.remove('hidden');
                    btnResume.disabled = false;
                } else {
                    btnResume.classList.add('hidden');
                }
                btnStop.disabled = !(isPlaying || isPaused || isSpeaking || (hasWords && currentIndex > 0 && currentIndex <
                    words.length));
                btnPrev.disabled = !(hasWords && currentIndex > 0);
                btnNext.disabled = !(hasWords && currentIndex < words.length - 1);
                btnRepeat.disabled = !(hasWords && currentIndex < words.length);
                if (isComplete) {
                    btnRepeat.disabled = true;
                    btnPlay.disabled = true;
                }
                fileInput.disabled = isPlaying || isPaused || isSpeaking;
            }

            // ---------- 核心播放逻辑 ----------

            // 取消语音和定时器（并重置时间戳）
            function cancelSpeechAndTimer() {
                if (window.speechSynthesis && utterance) {
                    try {
                        window.speechSynthesis.cancel();
                    } catch (e) { /* ignore */ }
                }
                if (timerId) {
                    clearTimeout(timerId);
                    timerId = null;
                    timerStartTime = null;
                }
                isSpeaking = false;
                utterance = null;
            }

            // 启动间隔定时器（封装，便于计算剩余时间）
            function startIntervalTimer(delay) {
                if (timerId) {
                    clearTimeout(timerId);
                    timerId = null;
                }
                timerStartTime = Date.now();
                timerId = setTimeout(function() {
                    timerId = null;
                    timerStartTime = null;
                    if (isPaused) {
                        isPlaying = false;
                        updateProgress();
                        return;
                    }
                    if (!isPlaying) {
                        updateProgress();
                        return;
                    }
                    currentIndex++;
                    speakWord(currentIndex);
                }, delay);
            }

            // 朗读指定索引的单词
            function speakWord(index) {
                if (!window.speechSynthesis) {
                    alert('您的浏览器不支持语音合成，请使用最新版 Chrome 或 Edge。');
                    stopPlayback();
                    return;
                }

                if (index >= words.length) {
                    finishPlayback();
                    return;
                }

                const word = words[index];
                if (!word || word.trim() === '') {
                    currentIndex++;
                    speakWord(currentIndex);
                    return;
                }

                cancelSpeechAndTimer();

                isSpeaking = true;
                isPlaying = true;
                isPaused = false;
                currentIndex = index;
                resetAnswerState();
                updateProgress();
                try { answerInput.focus(); } catch (e) {}

                utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.92;
                utterance.pitch = 1.0;
                utterance.volume = 1.0;

                utterance.onend = function(event) {
                    isSpeaking = false;
                    utterance = null;

                    if (answered) {
                        updateProgress();
                        return;
                    }
                    if (isPaused) {
                        isPlaying = false;
                        updateProgress();
                        return;
                    }
                    if (!isPlaying && !isPaused) {
                        updateProgress();
                        return;
                    }

                    if (isPlaying && !isPaused) {
                        if (currentIndex + 1 >= words.length) {
                            finishPlayback();
                            return;
                        }
                        const interval = getInterval() * 1000;
                        startIntervalTimer(interval);
                        updateProgress();
                    } else {
                        updateProgress();
                    }
                };

                utterance.onerror = function(event) {
                    console.warn('语音合成错误:', event);
                    isSpeaking = false;
                    utterance = null;
                    if (event.error !== 'canceled') {
                        if (isPlaying && !isPaused) {
                            if (currentIndex + 1 < words.length) {
                                // 错误后稍等再继续
                                setTimeout(() => {
                                    if (!isPaused && isPlaying) {
                                        currentIndex++;
                                        speakWord(currentIndex);
                                    } else {
                                        updateProgress();
                                    }
                                }, 500);
                            } else {
                                finishPlayback();
                            }
                        } else {
                            updateProgress();
                        }
                    } else {
                        updateProgress();
                    }
                };

                try {
                    window.speechSynthesis.speak(utterance);
                } catch (e) {
                    console.error('speak 异常:', e);
                    isSpeaking = false;
                    utterance = null;
                    if (isPlaying && !isPaused) {
                        setTimeout(() => {
                            if (!isPaused && isPlaying) {
                                currentIndex++;
                                speakWord(currentIndex);
                            } else {
                                updateProgress();
                            }
                        }, 300);
                    } else {
                        updateProgress();
                    }
                }

                updateProgress();
            }

            // 跳转到指定索引
            function jumpTo(index, autoPlay = true) {
                if (index < 0) index = 0;
                if (index >= words.length) index = words.length - 1;
                if (index === currentIndex && isPlaying) {
                    return;
                }
                cancelSpeechAndTimer();
                if (isPlaying || isPaused || isSpeaking) {
                    isPlaying = false;
                    isPaused = false;
                    isSpeaking = false;
                }
                currentIndex = index;
                updateProgress();
                if (autoPlay && words.length > 0 && index < words.length) {
                    isPlaying = true;
                    isPaused = false;
                    speakWord(currentIndex);
                } else {
                    updateButtons();
                }
            }

            function startPlayback() {
                if (words.length === 0) return;
                if (currentIndex >= words.length) {
                    currentIndex = 0;
                    updateProgress();
                }
                if (isPaused) {
                    resumePlayback();
                    return;
                }
                if (isPlaying || isSpeaking) return;
                isPlaying = true;
                isPaused = false;
                isStopped = false;
                speakWord(currentIndex);
            }

            function pausePlayback() {
                if (!isPlaying && !isSpeaking) return;
                if (isPaused) return;
                isPaused = true;
                isPlaying = false;
                cancelSpeechAndTimer();
                updateProgress();
            }

            function resumePlayback() {
                if (!isPaused) return;
                if (words.length === 0) return;
                if (currentIndex >= words.length) {
                    currentIndex = 0;
                    isPaused = false;
                    isStopped = false;
                    startPlayback();
                    return;
                }
                isPaused = false;
                isPlaying = true;
                isStopped = false;
                speakWord(currentIndex);
            }

            function stopPlayback() {
                cancelSpeechAndTimer();
                clearAutoAdvance();
                isPlaying = false;
                isPaused = false;
                isSpeaking = false;
                isStopped = true;
                currentIndex = 0;
                results = {};
                resetAnswerState();
                updateProgress();
                btnPlay.disabled = false;
                btnPause.classList.add('hidden');
                btnResume.classList.add('hidden');
                btnStop.disabled = true;
                answerFeedback.textContent = '';
                answerFeedback.className = 'answer-feedback';
                renderWordList();
                updateListStatus('已停止');
                updateButtons();
            }

            function finishPlayback() {
                isPlaying = false;
                isSpeaking = false;
                isPaused = false;
                cancelSpeechAndTimer();
                clearAutoAdvance();
                currentIndex = words.length;
                answered = true;
                answerInput.disabled = true;
                revealBtn.disabled = true;
                answerInput.value = '';
                answerFeedback.textContent = '🎉 全部完成！';
                answerFeedback.className = 'answer-feedback ok';
                updateProgress();
                updateListStatus('✅ 完成');
                btnPlay.disabled = true;
                btnStop.disabled = true;
                btnRepeat.disabled = true;
                btnPause.classList.add('hidden');
                btnResume.classList.add('hidden');
                renderWordList();
                updateButtons();
            }

            function repeatCurrent() {
                if (words.length === 0 || currentIndex >= words.length) return;
                cancelSpeechAndTimer();
                isPlaying = false;
                isPaused = false;
                isSpeaking = false;
                isPlaying = true;
                speakWord(currentIndex);
                updateButtons();
            }

            // ---------- 加载单词列表 ----------
            function loadWords(newWords) {
                if (isPlaying || isPaused || isSpeaking) {
                    cancelSpeechAndTimer();
                    isPlaying = false;
                    isPaused = false;
                    isSpeaking = false;
                }
                clearAutoAdvance();
                words = newWords.filter(w => w.trim() !== '');
                currentIndex = 0;
                isStopped = true;
                results = {};
                resetAnswerState();

                updateWordCount();
                renderWordList();
                updateProgress();
                updateListStatus(words.length > 0 ? '已加载' : '就绪');

                btnPlay.disabled = words.length === 0;
                btnStop.disabled = true;
                btnPause.classList.add('hidden');
                btnResume.classList.add('hidden');
                btnPrev.disabled = true;
                btnNext.disabled = words.length < 2;
                btnRepeat.disabled = words.length === 0;

                if (words.length > 0) {
                    progressText.textContent = `1 / ${words.length}`;
                    progressSlider.value = 0;
                    sliderIndex.textContent = '1';
                    sliderTotal.textContent = words.length;
                    answerFeedback.textContent = '';
                    answerFeedback.className = 'answer-feedback';
                } else {
                    progressText.textContent = '0 / 0';
                    progressSlider.value = 0;
                    sliderIndex.textContent = '0';
                    sliderTotal.textContent = '0';
                    answerFeedback.textContent = '';
                    answerFeedback.className = 'answer-feedback';
                }
                fileName.textContent = words.length > 0 ? `✅ 已加载 ${words.length} 个词` : '';
                updateButtons();
                syncAnswerUI();
            }

            // ---------- 文件上传处理 ----------
            function handleFile(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const text = e.target.result;
                    const lines = text.split(/\r?\n/).map(line => line.trim()).filter(line => line !== '');
                    if (lines.length === 0) {
                        alert('文件为空或没有有效的单词，请检查文件内容。');
                        return;
                    }
                    loadWords(lines);
                    fileName.textContent = `📄 ${file.name} (${lines.length} 个词)`;
                };
                reader.onerror = function() {
                    alert('读取文件失败，请重试。');
                };
                reader.readAsText(file, 'UTF-8');
            }

            // ---------- 事件绑定 ----------

            fileInput.addEventListener('change', function(e) {
                if (this.files && this.files.length > 0) {
                    const file = this.files[0];
                    if (file.type === 'text/plain' || file.name.endsWith('.txt')) {
                        handleFile(file);
                    } else {
                        alert('请上传 .txt 格式的文件。');
                    }
                }
                this.value = '';
            });

            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                this.classList.add('dragover');
            });
            uploadArea.addEventListener('dragleave', function(e) {
                e.preventDefault();
                this.classList.remove('dragover');
            });
            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                this.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files && files.length > 0) {
                    const file = files[0];
                    if (file.type === 'text/plain' || file.name.endsWith('.txt')) {
                        handleFile(file);
                    } else {
                        alert('请上传 .txt 格式的文件。');
                    }
                }
            });

            btnExample.addEventListener('click', function() {
                loadWords(EXAMPLE_WORDS);
                fileName.textContent = `📋 示例数据 (${EXAMPLE_WORDS.length} 个词)`;
            });

            btnClear.addEventListener('click', function() {
                if (isPlaying || isPaused || isSpeaking) {
                    if (!confirm('正在播放，确定要清空并停止吗？')) return;
                    cancelSpeechAndTimer();
                    clearAutoAdvance();
                    isPlaying = false;
                    isPaused = false;
                    isSpeaking = false;
                }
                loadWords([]);
                fileName.textContent = '';
                progressText.textContent = '0 / 0';
                progressSlider.value = 0;
                sliderIndex.textContent = '0';
                sliderTotal.textContent = '0';
                answerFeedback.textContent = '';
                answerFeedback.className = 'answer-feedback';
                updateListStatus('就绪');
                btnPlay.disabled = true;
                btnStop.disabled = true;
                btnPrev.disabled = true;
                btnNext.disabled = true;
                btnRepeat.disabled = true;
                btnPause.classList.add('hidden');
                btnResume.classList.add('hidden');
                syncAnswerUI();
            });

            btnPlay.addEventListener('click', function() {
                if (words.length === 0) return;
                if (currentIndex >= words.length) {
                    currentIndex = 0;
                    updateProgress();
                }
                startPlayback();
            });

            btnPause.addEventListener('click', pausePlayback);
            btnResume.addEventListener('click', resumePlayback);
            btnStop.addEventListener('click', stopPlayback);

            btnPrev.addEventListener('click', function() {
                if (words.length === 0 || currentIndex <= 0) return;
                const newIdx = currentIndex - 1;
                const autoPlay = isPlaying || isSpeaking;
                jumpTo(newIdx, autoPlay);
            });

            btnNext.addEventListener('click', function() {
                if (words.length === 0 || currentIndex >= words.length - 1) return;
                const newIdx = currentIndex + 1;
                const autoPlay = isPlaying || isSpeaking;
                jumpTo(newIdx, autoPlay);
            });

            btnRepeat.addEventListener('click', repeatCurrent);

            answerForm.addEventListener('submit', function(e) {
                e.preventDefault();
                evaluateAnswer();
            });

            answerInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    evaluateAnswer();
                }
            });

            answerInput.addEventListener('input', function() {
                if (this.value.trim() && timerId) {
                    clearTimeout(timerId);
                    timerId = null;
                    timerStartTime = null;
                }
            });

            revealBtn.addEventListener('click', revealAnswer);

            progressSlider.addEventListener('input', function() {
                const val = parseInt(this.value);
                if (isNaN(val)) return;
                if (words.length === 0) return;
                const autoPlay = isPlaying || isSpeaking;
                const idx = Math.min(Math.max(val, 0), words.length - 1);
                if (idx === currentIndex && (isPlaying || isSpeaking)) {
                    return;
                }
                cancelSpeechAndTimer();
                if (isPlaying || isPaused || isSpeaking) {
                    isPlaying = false;
                    isPaused = false;
                    isSpeaking = false;
                }
                currentIndex = idx;
                updateProgress();
                if (autoPlay && words.length > 0) {
                    isPlaying = true;
                    speakWord(currentIndex);
                } else {
                    updateButtons();
                }
            });

            // ========== 间隔滑块调整：精确计算剩余时间 ==========
            intervalRange.addEventListener('input', function() {
                updateIntervalDisplay();

                // 如果当前有等待定时器，则根据已过时间计算新的剩余延迟
                if (timerId && timerStartTime) {
                    const elapsed = Date.now() - timerStartTime; // 已经等待的毫秒数
                    const newInterval = getInterval() * 1000;
                    let remaining = newInterval - elapsed;
                    if (remaining < 0) remaining = 0;

                    // 清除旧定时器
                    clearTimeout(timerId);
                    timerId = null;

                    // 如果剩余时间 <= 0，立即执行回调（播放下一个词）
                    if (remaining === 0) {
                        // 直接执行定时器回调逻辑
                        timerStartTime = null;
                        if (isPaused) {
                            isPlaying = false;
                            updateProgress();
                            return;
                        }
                        if (!isPlaying) {
                            updateProgress();
                            return;
                        }
                        currentIndex++;
                        speakWord(currentIndex);
                    } else {
                        // 重新设置定时器，剩余时间为 remaining
                        timerStartTime = Date.now();
                        timerId = setTimeout(function() {
                            timerId = null;
                            timerStartTime = null;
                            if (isPaused) {
                                isPlaying = false;
                                updateProgress();
                                return;
                            }
                            if (!isPlaying) {
                                updateProgress();
                                return;
                            }
                            currentIndex++;
                            speakWord(currentIndex);
                        }, remaining);
                    }
                }
                // 如果没有定时器（正在朗读或暂停），不做处理，新间隔将在下次等待时生效
            });

            // 折叠按钮
            toggleCurrentBtn.addEventListener('click', toggleCurrent);
            toggleListBtn.addEventListener('click', toggleList);

            // ---------- 初始化 ----------
            function init() {
                checkTTS();
                updateIntervalDisplay();
                loadWords([]);
                initVisibility();
                if (!window.speechSynthesis) {
                    ttsWarning.classList.add('show');
                }
                console.log('🎧 单词听写助手已加载（间隔调整精确计算剩余时间）');
            }

            // 键盘快捷键
            document.addEventListener('keydown', function(e) {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    if (isPlaying || isSpeaking) {
                        pausePlayback();
                    } else if (isPaused) {
                        resumePlayback();
                    } else if (words.length > 0 && !btnPlay.disabled) {
                        startPlayback();
                    }
                }
                if (e.key === 's' || e.key === 'S') {
                    if (!e.ctrlKey && !e.metaKey) {
                        stopPlayback();
                    }
                }
                if (e.key === 'ArrowRight' && !e.ctrlKey) {
                    if (words.length > 0 && currentIndex < words.length - 1) {
                        btnNext.click();
                    }
                }
                if (e.key === 'ArrowLeft' && !e.ctrlKey) {
                    if (words.length > 0 && currentIndex > 0) {
                        btnPrev.click();
                    }
                }
                if (e.key === 'r' || e.key === 'R') {
                    if (!e.ctrlKey && !e.metaKey) {
                        btnRepeat.click();
                    }
                }
            });

            init();

            window.__dictation = {
                words,
                currentIndex,
                isPlaying,
                isPaused,
                isSpeaking,
                loadWords,
                startPlayback,
                pausePlayback,
                resumePlayback,
                stopPlayback,
                repeatCurrent,
                jumpTo,
                renderWordList,
                updateProgress,
                toggleCurrent,
                toggleList
            };

        })();
    </script>

</body>
</html>
